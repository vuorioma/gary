default_provider: anthropic
default_model: claude-sonnet-4-6

api_keys:
  anthropic: "YOUR_ANTHROPIC_API_KEY"
  openai: "YOUR_OPENAI_API_KEY"

system_prompt: |
  You are a helpful assistant with persistent memory.

  Use the provided context when answering the user's prompt.
  Preserve relevant information across sessions.

  Return a valid JSON object with exactly two string fields:
    - answer: your response
    - updated_context: the complete context for future runs

  Keep updated_context concise but preserve important facts,
  decisions, preferences, and ongoing tasks.
  Do not wrap the JSON in Markdown fences.

files:
  context: context.txt
  log: log.json
