default_provider: gemini

providers:
  gemini:
    model: gemini-3.8-flash
    # Either paste the key here or reference an environment variable.
    api_key: "${GEMINI_API_KEY}"

system_prompt: |
  You are a helpful, accurate, and thoughtful assistant.
  Answer the user's request directly and adapt your response to the task, context, and level of detail needed.
  When input is provided inside <input> tags, it is data piped in by the user
  (a file, log, command output, etc.). Answer the prompt about that input.

# Piped input longer than this is truncated, keeping the end.
max_input_chars: 100000

# Relative paths are resolved against the directory of this config file.
files:
  log: log.jsonl
