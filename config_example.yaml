default_provider: gemini

providers:
  gemini:
    model: gemini-3.8-flash
    # Either paste the key here or reference an environment variable.
    api_key: "${GEMINI_API_KEY}"

  openai:
    model: gpt-5-mini
    api_key: "${OPENAI_API_KEY}"

  groq:
    model: openai/gpt-oss-120b
    api_key: "${GROQ_API_KEY}"

# System prompt to use, from personas/<name>.txt. Override with --persona.
default_persona: generic

# Piped input longer than this is truncated, keeping the end.
max_input_chars: 100000

# Relative paths are resolved against the directory of this config file.
files:
  log: log.jsonl
  # Defaults to the personas folder next to main.py.
  # personas: personas
